<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Portail Documentaire — Cabinet</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Source+Serif+4:wght@500;600;700&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
  :root{
    --navy:#16324a; --navy-deep:#0d2036; --slate:#4a5b70; --slate-light:#8695a7;
    --mist:#eef2f5; --paper:#ffffff; --line:#dde3e9;
    --teal:#2f8f83; --amber:#c8862b; --rouge:#b5453f;
    --radius:10px; --shadow:0 1px 2px rgba(13,32,54,0.06), 0 8px 24px -12px rgba(13,32,54,0.15);
  }
  *{box-sizing:border-box;}
  body{ margin:0; font-family:'Inter',system-ui,sans-serif; background:var(--mist); color:var(--navy-deep); -webkit-font-smoothing:antialiased; }
  h1,h2,h3{ font-family:'Source Serif 4', Georgia, serif; font-weight:600; margin:0; letter-spacing:-0.01em;}
  .mono{ font-family:'JetBrains Mono', monospace; font-size:12px; letter-spacing:0.03em; text-transform:uppercase; color:var(--slate-light); }

  #login-screen{ min-height:100vh; display:flex; align-items:center; justify-content:center;
    background: radial-gradient(circle at 15% 20%, rgba(22,50,74,0.05), transparent 40%), linear-gradient(180deg, #f7f9fa 0%, var(--mist) 100%); }
  .login-card{ width:380px; background:var(--paper); border:1px solid var(--line); border-radius:var(--radius); box-shadow:var(--shadow); padding:36px 32px; }
  .login-mark{ width:44px; height:44px; border-radius:8px; background:var(--navy); display:flex; align-items:center; justify-content:center; margin-bottom:20px; }
  .login-mark svg{ width:22px; height:22px; }
  .login-card h1{ font-size:21px; margin-bottom:4px; }
  .login-card p.sub{ color:var(--slate); font-size:13.5px; margin:0 0 24px 0; }
  label{ display:block; font-size:12.5px; font-weight:600; color:var(--slate); margin-bottom:6px; }
  input[type=email], input[type=password], input[type=text], input[type=number], select{
    width:100%; padding:10px 12px; border:1px solid var(--line); border-radius:7px;
    font-size:14px; font-family:inherit; margin-bottom:16px; background:#fcfdfd; transition:border-color .15s ease;
  }
  input:focus, select:focus{ outline:none; border-color:var(--navy); box-shadow:0 0 0 3px rgba(22,50,74,0.08); }
  button.primary{ width:100%; padding:11px; border:none; border-radius:7px; background:var(--navy); color:#fff; font-weight:600; font-size:14px; cursor:pointer; transition:background .15s ease; }
  button.primary:hover{ background:var(--navy-deep); }
  button.secondary{ padding:8px 14px; border:1px solid var(--line); border-radius:7px; background:#fff; color:var(--navy-deep); font-weight:600; font-size:13px; cursor:pointer; }
  button.secondary:hover{ background:var(--mist); }
  #login-error{ color:var(--rouge); font-size:13px; margin-top:12px; display:none; }

  #app-screen{ display:none; min-height:100vh; }
  .topbar{ height:56px; background:var(--navy); display:flex; align-items:center; padding:0 20px; justify-content:space-between; color:#fff; }
  .topbar .brand{ display:flex; align-items:center; gap:10px; font-family:'Source Serif 4',serif; font-size:16px; font-weight:600; }
  .topbar .brand .dot{ width:8px; height:8px; border-radius:50%; background:var(--teal); }
  .topbar .who{ font-size:13px; opacity:0.85; display:flex; align-items:center; gap:12px; }
  .topbar button.logout{ background:transparent; border:1px solid rgba(255,255,255,0.3); color:#fff; padding:6px 12px; border-radius:6px; font-size:12.5px; cursor:pointer; }
  .topbar button.logout:hover{ background:rgba(255,255,255,0.1); }

  .layout{ display:flex; }
  .sidebar{ width:250px; background:var(--paper); border-right:1px solid var(--line); min-height:calc(100vh - 56px); padding:20px 14px; }
  .sidebar .cat{ font-size:11px; font-weight:700; letter-spacing:0.04em; text-transform:uppercase; color:var(--slate-light); padding:14px 10px 6px; }
  .sidebar a.item{ display:flex; align-items:center; gap:9px; padding:8px 10px; border-radius:7px; color:var(--navy-deep); text-decoration:none; font-size:13.5px; margin-bottom:1px; cursor:pointer; }
  .sidebar a.item:hover{ background:var(--mist); }
  .sidebar a.item.active{ background:var(--navy); color:#fff; }
  .sidebar a.item .count{ margin-left:auto; font-size:11px; color:var(--slate-light); }
  .sidebar a.item.active .count{ color:rgba(255,255,255,0.7); }

  .main{ flex:1; padding:28px 32px; max-width:1100px; }
  .main h2{ font-size:22px; margin-bottom:4px; }
  .main p.lead{ color:var(--slate); font-size:14px; margin:0 0 24px 0; }
  .main-head{ display:flex; justify-content:space-between; align-items:flex-start; margin-bottom:6px; }

  .cards{ display:grid; grid-template-columns:repeat(auto-fit, minmax(200px,1fr)); gap:14px; margin-bottom:28px; }
  .card{ background:var(--paper); border:1px solid var(--line); border-radius:var(--radius); padding:18px 20px; }
  .card .mono{ display:block; margin-bottom:8px; }
  .card .val{ font-family:'Source Serif 4',serif; font-size:28px; font-weight:600; }
  .card .val.amber{ color:var(--amber); } .card .val.teal{ color:var(--teal); }

  .panel{ background:var(--paper); border:1px solid var(--line); border-radius:var(--radius); overflow:hidden; margin-bottom:20px; }
  .panel-head{ padding:14px 18px; border-bottom:1px solid var(--line); font-weight:600; font-size:14px; display:flex; justify-content:space-between; align-items:center; }
  .drop-zone{ margin:16px 18px; border:1.5px dashed var(--line); border-radius:8px; padding:30px; text-align:center; color:var(--slate-light); font-size:13px; transition:border-color .15s; cursor:pointer; }
  .drop-zone.drag{ border-color:var(--navy); color:var(--navy); background:var(--mist); }
  table{ width:100%; border-collapse:collapse; font-size:13.5px; }
  th{ text-align:left; padding:9px 18px; color:var(--slate-light); font-size:11px; text-transform:uppercase; letter-spacing:0.03em; border-bottom:1px solid var(--line); }
  td{ padding:11px 18px; border-bottom:1px solid var(--line); }
  tr:last-child td{ border-bottom:none; }
  .badge{ display:inline-block; padding:3px 9px; border-radius:20px; font-size:11.5px; font-weight:600; }
  .badge.valide{ background:rgba(47,143,131,0.12); color:var(--teal); }
  .badge.manquant, .badge.a_completer{ background:rgba(200,134,43,0.12); color:var(--amber); }
  .badge.recu{ background:rgba(22,50,74,0.08); color:var(--navy); }
  .badge.rejete{ background:rgba(181,69,63,0.1); color:var(--rouge); }
  .empty-hint{ padding:14px 18px; color:var(--slate-light); font-size:12.5px; border-top:1px dashed var(--line); }

  .modal-overlay{ display:none; position:fixed; inset:0; background:rgba(13,32,54,0.45); align-items:center; justify-content:center; z-index:50; }
  .modal-overlay.open{ display:flex; }
  .modal{ width:420px; background:#fff; border-radius:var(--radius); padding:26px 28px; box-shadow:var(--shadow); max-height:86vh; overflow-y:auto; }
  .modal h3{ font-size:18px; margin-bottom:18px; }
  .modal-actions{ display:flex; gap:10px; margin-top:4px; }
  .modal-actions button.secondary{ flex:1; }
  .modal-actions button.primary{ flex:1; }
  #client-form-msg{ font-size:13px; margin-bottom:10px; display:none; }
  #client-form-msg.err{ color:var(--rouge); } #client-form-msg.ok{ color:var(--teal); }
  .toast{ position:fixed; bottom:24px; right:24px; background:var(--navy-deep); color:#fff; padding:12px 18px; border-radius:8px; font-size:13.5px; box-shadow:var(--shadow); display:none; z-index:60; }

  .notif-wrap{ position:relative; }
  .notif-btn{ background:transparent; border:none; color:#fff; cursor:pointer; position:relative; padding:6px; display:flex; align-items:center; }
  .notif-btn svg{ width:18px; height:18px; }
  .notif-dot{ position:absolute; top:3px; right:3px; width:8px; height:8px; border-radius:50%; background:var(--amber); border:1.5px solid var(--navy); display:none; }
  .notif-dropdown{ display:none; position:absolute; right:0; top:38px; width:320px; max-height:380px; overflow-y:auto; background:#fff; border:1px solid var(--line); border-radius:var(--radius); box-shadow:var(--shadow); z-index:40; }
  .notif-dropdown.open{ display:block; }
  .notif-item{ padding:11px 15px; border-bottom:1px solid var(--line); font-size:12.5px; color:var(--navy-deep); cursor:pointer; }
  .notif-item:last-child{ border-bottom:none; }
  .notif-item:hover{ background:var(--mist); }
  .notif-item.unread{ background:rgba(22,50,74,0.04); font-weight:600; }
  .notif-item .when{ display:block; color:var(--slate-light); font-weight:400; font-size:11px; margin-top:3px; }
  .notif-empty{ padding:16px; text-align:center; color:var(--slate-light); font-size:12.5px; }

  .breadcrumb{ font-size:12.5px; color:var(--slate); margin-bottom:10px; cursor:pointer; }
  .breadcrumb:hover{ color:var(--navy); text-decoration:underline; }
  .comment-thread{ padding:14px 18px; display:flex; flex-direction:column; gap:10px; max-height:220px; overflow-y:auto; }
  .comment{ font-size:13px; background:var(--mist); border-radius:8px; padding:9px 12px; }
  .comment .meta{ font-size:11px; color:var(--slate-light); margin-bottom:3px; }
  .comment-input{ display:flex; gap:8px; padding:14px 18px; border-top:1px solid var(--line); }
  .comment-input textarea{ flex:1; resize:none; border:1px solid var(--line); border-radius:7px; padding:8px 10px; font-family:inherit; font-size:13px; height:38px; }
  .doc-actions{ display:flex; gap:8px; padding:0 18px 16px; }
  .doc-actions button{ flex:1; }
  button.valider{ background:var(--teal); color:#fff; border:none; border-radius:7px; padding:9px; font-weight:600; font-size:13px; cursor:pointer; }
  button.rejeter{ background:#fff; color:var(--rouge); border:1px solid var(--rouge); border-radius:7px; padding:9px; font-weight:600; font-size:13px; cursor:pointer; }
</style>
</head>
<body>

<div id="login-screen">
  <div class="login-card">
    <div class="login-mark">
      <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
        <path d="M4 4h11l5 5v11a1 1 0 01-1 1H4a1 1 0 01-1-1V5a1 1 0 011-1z" stroke="#fff" stroke-width="1.6"/>
        <path d="M8 12h8M8 16h5" stroke="#fff" stroke-width="1.6" stroke-linecap="round"/>
      </svg>
    </div>
    <h1>Portail Documentaire</h1>
    <p class="sub">Connectez-vous à votre espace sécurisé.</p>
    <form id="login-form">
      <label for="email">Adresse e-mail</label>
      <input type="email" id="email" required autocomplete="username">
      <label for="password">Mot de passe</label>
      <input type="password" id="password" required autocomplete="current-password">
      <button type="submit" class="primary">Se connecter</button>
      <div id="login-error"></div>
    </form>
  </div>
</div>

<div id="recovery-screen" style="display:none; min-height:100vh; align-items:center; justify-content:center;">
  <div class="login-card">
    <div class="login-mark">
      <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
        <path d="M4 4h11l5 5v11a1 1 0 01-1 1H4a1 1 0 01-1-1V5a1 1 0 011-1z" stroke="#fff" stroke-width="1.6"/>
        <path d="M8 12h8M8 16h5" stroke="#fff" stroke-width="1.6" stroke-linecap="round"/>
      </svg>
    </div>
    <h1>Définir votre mot de passe</h1>
    <p class="sub">Choisissez un mot de passe pour accéder à votre espace.</p>
    <form id="recovery-form">
      <label for="rec-password">Nouveau mot de passe</label>
      <input type="password" id="rec-password" required minlength="6" autocomplete="new-password">
      <label for="rec-password-confirm">Confirmer le mot de passe</label>
      <input type="password" id="rec-password-confirm" required minlength="6" autocomplete="new-password">
      <button type="submit" class="primary">Valider</button>
      <div id="recovery-error" style="color:var(--rouge); font-size:13px; margin-top:12px; display:none;"></div>
    </form>
  </div>
</div>

<div id="app-screen">
  <div class="topbar">
    <div class="brand"><span class="dot"></span> Portail Documentaire</div>
    <div class="who">
      <div class="notif-wrap">
        <button class="notif-btn" id="notif-btn">
          <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
            <path d="M6 8a6 6 0 1112 0c0 4 1.5 6 2 6.5H4C4.5 14 6 12 6 8z" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/>
            <path d="M10 18a2 2 0 004 0" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/>
          </svg>
          <span class="notif-dot" id="notif-dot"></span>
        </button>
        <div class="notif-dropdown" id="notif-dropdown"></div>
      </div>
      <span id="who-name">—</span>
      <button class="logout" id="btn-logout">Déconnexion</button>
    </div>
  </div>
  <div class="layout">
    <div class="sidebar" id="sidebar"></div>
    <div class="main" id="main-content"></div>
  </div>
</div>

<div class="modal-overlay" id="modal-new-client">
  <div class="modal">
    <h3>Nouveau client</h3>
    <div id="client-form-msg"></div>
    <form id="new-client-form">
      <label>Raison sociale *</label>
      <input type="text" id="nc-raison" required>
      <label>NINEA</label>
      <input type="text" id="nc-ninea">
      <label>RCCM</label>
      <input type="text" id="nc-rccm">
      <label>Nom complet du contact *</label>
      <input type="text" id="nc-contact" required>
      <label>E-mail du contact *</label>
      <input type="email" id="nc-email" required>
      <label>Téléphone</label>
      <input type="text" id="nc-tel">
      <div class="modal-actions">
        <button type="button" class="secondary" id="nc-cancel">Annuler</button>
        <button type="submit" class="primary">Créer le client</button>
      </div>
    </form>
  </div>
</div>

<div class="modal-overlay" id="modal-doc-detail">
  <div class="modal" style="width:460px">
    <h3 id="dd-filename">Document</h3>
    <p class="lead" id="dd-meta" style="margin-bottom:14px"></p>
    <div class="panel" style="margin-bottom:14px">
      <div class="comment-thread" id="dd-comments"></div>
      <div class="comment-input">
        <textarea id="dd-comment-input" placeholder="Ajouter un commentaire…"></textarea>
        <button class="secondary" id="dd-comment-send">Envoyer</button>
      </div>
    </div>
    <div class="doc-actions" id="dd-actions"></div>
    <div class="modal-actions">
      <button type="button" class="secondary" id="dd-close" style="flex:1">Fermer</button>
    </div>
  </div>
</div>

<div class="modal-overlay" id="modal-request-doc">
  <div class="modal">
    <h3>Demander un document</h3>
    <div id="rd-msg" style="font-size:13px; margin-bottom:10px; display:none;"></div>
    <form id="request-doc-form">
      <label>Catégorie *</label>
      <select id="rd-categorie" required></select>
      <label>Message pour le client *</label>
      <textarea id="rd-message" required style="width:100%; padding:10px 12px; border:1px solid var(--line); border-radius:7px; font-size:14px; font-family:inherit; margin-bottom:16px; height:70px; resize:vertical;" placeholder="Ex : merci de transmettre le relevé bancaire de juin"></textarea>
      <div class="modal-actions">
        <button type="button" class="secondary" id="rd-cancel">Annuler</button>
        <button type="submit" class="primary">Envoyer la demande</button>
      </div>
    </form>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
/* ============================================================
   CONFIGURATION SUPABASE — à renseigner
   ============================================================ */
const SUPABASE_URL = "https://pmlbvxizwdpkcssbdnvo.supabase.co";
const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InBtbGJ2eGl6d2Rwa2Nzc2JkbnZvIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODUxODg4MzYsImV4cCI6MjEwMDc2NDgzNn0.uLDe4VU24tykaaBLUkIVZCp-ukv5s-zXlKOxteMxOLw";
const sb = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

let currentProfile = null;
let currentClientId = null;     // pour le rôle "client"
let categoriesCache = [];        // liste des sous_categories avec libellé + catégorie parente
let selectedSousCategorieId = null;
let cabinetView = 'dashboard';   // 'dashboard' | 'clients' | 'client-detail'
let viewedClientId = null;       // dossier client consulté par le cabinet
let openDocId = null;            // document actuellement ouvert dans la modale de détail

function showToast(msg){
  const t = document.getElementById('toast');
  t.textContent = msg; t.style.display = 'block';
  setTimeout(() => t.style.display = 'none', 3500);
}

/* ---------- Connexion ---------- */
document.getElementById('login-form').addEventListener('submit', async (e) => {
  e.preventDefault();
  const email = document.getElementById('email').value;
  const password = document.getElementById('password').value;
  const errBox = document.getElementById('login-error');
  errBox.style.display = 'none';

  const { data, error } = await sb.auth.signInWithPassword({ email, password });
  if (error) {
    errBox.textContent = "Identifiants incorrects ou compte inactif.";
    errBox.style.display = 'block';
    return;
  }
  await loadProfileAndRender(data.user.id);
});

document.getElementById('btn-logout').addEventListener('click', async () => {
  await sb.auth.signOut();
  currentProfile = null;
  document.getElementById('app-screen').style.display = 'none';
  document.getElementById('login-screen').style.display = 'flex';
});

async function loadProfileAndRender(userId){
  const errBox = document.getElementById('login-error');
  const { data: profile, error: profErr } = await sb.from('profiles').select('*').eq('id', userId).single();
  if (profErr || !profile) {
    errBox.textContent = "Impossible de charger votre profil. Contactez votre cabinet.";
    errBox.style.display = 'block';
    return;
  }
  currentProfile = profile;

  if (profile.role === 'client') {
    const { data: cu } = await sb.from('client_users').select('client_id').eq('profile_id', userId).limit(1).single();
    currentClientId = cu ? cu.client_id : null;
  }

  await loadCategories();
  await renderApp();
}

async function loadCategories(){
  const { data, error } = await sb
    .from('sous_categories')
    .select('id, code, libelle, ordre, categorie_id, categories(code, libelle, ordre)')
    .order('ordre');
  categoriesCache = data || [];
  if (categoriesCache.length && !selectedSousCategorieId) {
    selectedSousCategorieId = categoriesCache[0].id;
  }
}

/* ---------- Rendu principal ---------- */
async function renderApp(){
  document.getElementById('login-screen').style.display = 'none';
  document.getElementById('app-screen').style.display = 'block';
  document.getElementById('who-name').textContent =
    currentProfile.nom_complet + " · " + roleLabel(currentProfile.role);

  if (currentProfile.role === 'client') {
    await renderSidebarClient();
    await renderMainClient();
  } else {
    renderSidebarCabinet();
    if (cabinetView === 'client-detail') await renderMainCabinetClientDetail();
    else if (cabinetView === 'clients') await renderMainCabinetClients();
    else await renderMainCabinetDashboard();
  }
  await refreshNotifBell();
}

function roleLabel(role){
  return { admin_cabinet:"Admin cabinet", collaborateur:"Collaborateur", client:"Espace client" }[role] || role;
}

/* ============================================================
   VUE CLIENT
   ============================================================ */
async function renderSidebarClient(){
  const s = document.getElementById('sidebar');
  let counts = {};
  if (currentClientId) {
    const { data } = await sb.from('documents').select('sous_categorie_id').eq('client_id', currentClientId);
    (data || []).forEach(d => counts[d.sous_categorie_id] = (counts[d.sous_categorie_id] || 0) + 1);
  }

  // Regrouper par catégorie parente
  const byCat = {};
  categoriesCache.forEach(sc => {
    const catLib = sc.categories.libelle;
    if (!byCat[catLib]) byCat[catLib] = [];
    byCat[catLib].push(sc);
  });

  let html = '';
  Object.entries(byCat).forEach(([catLib, subs]) => {
    html += `<div class="cat">${catLib}</div>`;
    subs.forEach(sc => {
      const active = sc.id === selectedSousCategorieId ? 'active' : '';
      html += `<a href="#" class="item ${active}" data-id="${sc.id}">${sc.libelle} <span class="count">${counts[sc.id] || 0}</span></a>`;
    });
  });
  s.innerHTML = html;

  s.querySelectorAll('a.item').forEach(el => {
    el.addEventListener('click', async (e) => {
      e.preventDefault();
      selectedSousCategorieId = parseInt(el.dataset.id);
      await renderSidebarClient();
      await renderMainClient();
    });
  });
}

async function renderMainClient(){
  const m = document.getElementById('main-content');
  if (!currentClientId) {
    m.innerHTML = `<h2>Aucun dossier lié</h2><p class="lead">Votre compte n'est associé à aucun dossier client. Contactez votre cabinet.</p>`;
    return;
  }

  const { data: allDocs } = await sb.from('documents').select('statut').eq('client_id', currentClientId);
  const total = (allDocs || []).length;
  const manquants = (allDocs || []).filter(d => d.statut === 'manquant' || d.statut === 'a_completer').length;
  const enAttente = (allDocs || []).filter(d => d.statut === 'recu').length;
  const valides = (allDocs || []).filter(d => d.statut === 'valide').length;

  const sc = categoriesCache.find(c => c.id === selectedSousCategorieId);
  const catLabel = sc ? sc.libelle : '';

  m.innerHTML = `
    <h2>Bonjour, ${currentProfile.nom_complet.split(' ')[0]}</h2>
    <p class="lead">Voici l'état de votre dossier documentaire.</p>
    <div class="cards">
      <div class="card"><span class="mono">Documents transmis</span><span class="val">${total}</span></div>

      <div class="card"><span class="mono">En attente de validation</span><span class="val">${enAttente}</span></div>

    </div>
    <div class="panel">
      <div class="panel-head">Dépôt — ${catLabel}</div>
      <div class="drop-zone" id="drop-zone">
        Glissez-déposez vos fichiers ici, ou cliquez pour parcourir<br>
        <span style="font-size:11.5px">PDF, Excel, Word, images — dépôt multiple accepté</span>
      </div>

async function loadDocumentsTable(){
  const tbody = document.getElementById('doc-table-body');
  const { data, error } = await sb
    .from('documents')
    .select('id, nom_fichier_original, exercice, statut, created_at')
    .eq('client_id', currentClientId)
    .eq('sous_categorie_id', selectedSousCategorieId)
    .order('created_at', { ascending: false });

  if (error || !data || data.length === 0) {
    tbody.innerHTML = `<tr><td colspan="4" class="empty-hint">Aucun document dans cette catégorie pour le moment.</td></tr>`;
    return;
  }
  tbody.innerHTML = data.map(d => `
    <tr class="doc-row" data-id="${d.id}" style="cursor:pointer">
      <td>${d.nom_fichier_original}</td>
      <td>${d.exercice}</td>
      <td><span class="badge ${d.statut}">${statutLabel(d.statut)}</span></td>
      <td>${new Date(d.created_at).toLocaleDateString('fr-FR')}</td>
    </tr>`).join('');
  tbody.querySelectorAll('tr.doc-row').forEach(row => {
    row.addEventListener('click', () => openDocumentDetail(row.dataset.id));
  });
}

function statutLabel(s){
  return { recu:'Reçu', manquant:'Manquant', a_completer:'À compléter', valide:'Validé', rejete:'Rejeté' }[s] || s;
}

/* ---------- Upload réel vers Supabase Storage ---------- */
function setupDropZone(){
  const zone = document.getElementById('drop-zone');
  const input = document.getElementById('file-input');
  if (!zone) return;
  zone.addEventListener('click', () => input.click());
  input.addEventListener('change', () => uploadFiles(input.files));
  ['dragover','dragenter'].forEach(evt => zone.addEventListener(evt, e => { e.preventDefault(); zone.classList.add('drag'); }));
  ['dragleave','drop'].forEach(evt => zone.addEventListener(evt, e => { e.preventDefault(); zone.classList.remove('drag'); }));
  zone.addEventListener('drop', e => uploadFiles(e.dataTransfer.files));
}

async function uploadFiles(fileList){
  const sc = categoriesCache.find(c => c.id === selectedSousCategorieId);
  if (!sc) return;
  const exercice = new Date().getFullYear();

  for (const file of Array.from(fileList)) {
    const safeName = file.name.replace(/[^a-zA-Z0-9._-]/g, '_');
    const storagePath = `${currentProfile.cabinet_id}/${currentClientId}/${sc.code}/${exercice}/${Date.now()}_${safeName}`;

    const { error: upErr } = await sb.storage.from('documents').upload(storagePath, file);
    if (upErr) { showToast(`Erreur upload ${file.name} : ${upErr.message}`); continue; }

    const { error: insErr } = await sb.from('documents').insert({
      cabinet_id: currentProfile.cabinet_id,
      client_id: currentClientId,
      sous_categorie_id: sc.id,
      exercice,
      nom_fichier_original: file.name,
      nom_fichier_stockage: storagePath,
      taille_octets: file.size,
      type_mime: file.type,
      statut: 'recu',
      depose_par: currentProfile.id,
    });
    if (insErr) { showToast(`Fichier envoyé mais erreur d'enregistrement : ${insErr.message}`); continue; }
  }
  showToast('Dépôt terminé.');
  await renderSidebarClient();
  await loadDocumentsTable();
}

    <div class="main-head">
      <div><h2>${client.raison_sociale}</h2><p class="lead">${client.ninea ? 'NINEA : ' + client.ninea : ''}</p></div>

/* ============================================================
   NOTIFICATIONS
   ============================================================ */
async function refreshNotifBell(){
  const { data } = await sb
    .from('notifications')
    .select('id, type, message, lu, created_at')
    .order('created_at', { ascending:false })
    .limit(20);

  const list = data || [];
  const dot = document.getElementById('notif-dot');
  const hasUnread = list.some(n => !n.lu);
  dot.style.display = hasUnread ? 'block' : 'none';

  const dropdown = document.getElementById('notif-dropdown');
  dropdown.innerHTML = list.length
    ? list.map(n => `
        <div class="notif-item ${n.lu ? '' : 'unread'}" data-id="${n.id}">
          ${n.message}
          <span class="when">${new Date(n.created_at).toLocaleString('fr-FR')}</span>
        </div>`).join('')
    : `<div class="notif-empty">Aucune notification.</div>`;

  dropdown.querySelectorAll('.notif-item').forEach(el => {
    el.addEventListener('click', async () => {
      await sb.from('notifications').update({ lu:true }).eq('id', el.dataset.id);
      await refreshNotifBell();
    });
  });
}

document.getElementById('notif-btn').addEventListener('click', () => {
  document.getElementById('notif-dropdown').classList.toggle('open');
});
document.addEventListener('click', (e) => {
  const wrap = document.querySelector('.notif-wrap');
  if (wrap && !wrap.contains(e.target)) document.getElementById('notif-dropdown').classList.remove('open');
});

/* ============================================================
   MODALE DÉTAIL DOCUMENT (commentaires + validation/rejet)
   ============================================================ */
async function openDocumentDetail(docId){
  openDocId = docId;
  const { data: doc } = await sb
    .from('documents')
    .select('*, clients(raison_sociale), sous_categories(libelle)')
    .eq('id', docId)
    .single();
  if (!doc) return;

  document.getElementById('dd-filename').textContent = doc.nom_fichier_original;
  document.getElementById('dd-meta').textContent =
    `${doc.sous_categories ? doc.sous_categories.libelle : ''} · Exercice ${doc.exercice} · ${statutLabel(doc.statut)}`;

  const actionsBox = document.getElementById('dd-actions');
  const isCabinet = ['admin_cabinet','collaborateur'].includes(currentProfile.role);
  if (isCabinet && doc.statut !== 'valide' && doc.statut !== 'rejete') {
    actionsBox.innerHTML = `
      <button class="valider" id="dd-valider">Valider</button>
      <button class="rejeter" id="dd-rejeter">Rejeter</button>
    `;
    document.getElementById('dd-valider').addEventListener('click', () => updateDocStatus(doc.id, 'valide'));
    document.getElementById('dd-rejeter').addEventListener('click', () => updateDocStatus(doc.id, 'rejete'));
  } else {
    actionsBox.innerHTML = '';
  }

  await loadCommentThread(docId);
  document.getElementById('modal-doc-detail').classList.add('open');
}

async function loadCommentThread(docId){
  const { data } = await sb
    .from('commentaires')
    .select('contenu, created_at, profiles(nom_complet, role)')
    .eq('document_id', docId)
    .order('created_at', { ascending:true });

  const box = document.getElementById('dd-comments');
  box.innerHTML = (data && data.length)
    ? data.map(c => `
        <div class="comment">
          <div class="meta">${c.profiles ? c.profiles.nom_complet : 'Utilisateur'} · ${new Date(c.created_at).toLocaleString('fr-FR')}</div>
          ${c.contenu}
        </div>`).join('')
    : `<div class="notif-empty">Aucun commentaire pour l'instant.</div>`;
  box.scrollTop = box.scrollHeight;
}

document.getElementById('dd-comment-send').addEventListener('click', async () => {
  const input = document.getElementById('dd-comment-input');
  const contenu = input.value.trim();
  if (!contenu || !openDocId) return;
  const { error } = await sb.from('commentaires').insert({
    document_id: openDocId, auteur_id: currentProfile.id, contenu,
  });
  if (error) { showToast("Erreur d'envoi du commentaire."); return; }
  input.value = '';
  await loadCommentThread(openDocId);
});

async function updateDocStatus(docId, statut){
  const { error } = await sb.from('documents').update({
    statut, valide_par: currentProfile.id, valide_le: new Date().toISOString(),
  }).eq('id', docId);
  if (error) { showToast("Erreur lors de la mise à jour du statut."); return; }
  showToast(statut === 'valide' ? 'Document validé.' : 'Document rejeté.');
  document.getElementById('modal-doc-detail').classList.remove('open');
  if (cabinetView === 'client-detail') await renderMainCabinetClientDetail();
  else await renderApp();
}

document.getElementById('dd-close').addEventListener('click', () => {
  document.getElementById('modal-doc-detail').classList.remove('open');
  openDocId = null;
});

/* ============================================================
   MODALE DEMANDE DE DOCUMENT (cabinet -> client)
   ============================================================ */
function openRequestDocModal(clientId){
  const select = document.getElementById('rd-categorie');
  select.innerHTML = categoriesCache.map(sc =>
    `<option value="${sc.id}">${sc.categories.libelle} — ${sc.libelle}</option>`).join('');
  document.getElementById('request-doc-form').dataset.clientId = clientId;
  document.getElementById('modal-request-doc').classList.add('open');
}

document.getElementById('rd-cancel').addEventListener('click', () => {
  document.getElementById('modal-request-doc').classList.remove('open');
});

document.getElementById('request-doc-form').addEventListener('submit', async (e) => {
  e.preventDefault();
  const msg = document.getElementById('rd-msg');
  msg.style.display = 'none';
  const clientId = e.target.dataset.clientId;
  const sousCategorieId = parseInt(document.getElementById('rd-categorie').value);
  const message = document.getElementById('rd-message').value;
  const sc = categoriesCache.find(c => c.id === sousCategorieId);

  const { data: placeholder, error: docErr } = await sb.from('documents').insert({
    cabinet_id: currentProfile.cabinet_id,
    client_id: clientId,
    sous_categorie_id: sousCategorieId,
    exercice: new Date().getFullYear(),
    nom_fichier_original: `Demande — ${sc ? sc.libelle : ''}`,
    nom_fichier_stockage: '',
    statut: 'a_completer',
    depose_par: currentProfile.id,
  }).select().single();

  if (docErr) {
    msg.textContent = "Erreur lors de la création de la demande.";
    msg.className = 'err'; msg.style.display = 'block';
    return;
  }

  await sb.from('commentaires').insert({
    document_id: placeholder.id, auteur_id: currentProfile.id, contenu: message,
  });

  msg.textContent = "Demande envoyée au client.";
  msg.className = 'ok'; msg.style.display = 'block';
  document.getElementById('request-doc-form').reset();
  setTimeout(async () => {
    document.getElementById('modal-request-doc').classList.remove('open');
    msg.style.display = 'none';
    if (cabinetView === 'client-detail') await renderMainCabinetClientDetail();
  }, 1000);
});

/* ---------- Réinitialisation de mot de passe (lien reçu par e-mail) ---------- */
document.getElementById('recovery-form').addEventListener('submit', async (e) => {
  e.preventDefault();
  const pw1 = document.getElementById('rec-password').value;
  const pw2 = document.getElementById('rec-password-confirm').value;
  const errBox = document.getElementById('recovery-error');
  errBox.style.display = 'none';

  if (pw1 !== pw2) {
    errBox.textContent = "Les deux mots de passe ne correspondent pas.";
    errBox.style.display = 'block';
    return;
  }
  if (pw1.length < 6) {
    errBox.textContent = "Le mot de passe doit contenir au moins 6 caractères.";
    errBox.style.display = 'block';
    return;
  }

  const { data, error } = await sb.auth.updateUser({ password: pw1 });
  if (error) {
    errBox.textContent = "Erreur : " + error.message;
    errBox.style.display = 'block';
    return;
  }

  // Nettoyer l'URL (retirer le token affiché dans la barre d'adresse) puis entrer dans l'app
  history.replaceState(null, '', window.location.pathname);
  document.getElementById('recovery-screen').style.display = 'none';
  await loadProfileAndRender(data.user.id);
});

/* ---------- Détection du lien de réinitialisation (clic depuis l'e-mail) ---------- */
sb.auth.onAuthStateChange((event, session) => {
  if (event === 'PASSWORD_RECOVERY') {
    document.getElementById('login-screen').style.display = 'none';
    document.getElementById('app-screen').style.display = 'none';
    document.getElementById('recovery-screen').style.display = 'flex';
  }
});

/* ---------- Restauration de session au chargement ---------- */
(async () => {
  const { data: { session } } = await sb.auth.getSession();
  if (session) await loadProfileAndRender(session.user.id);
})();
</script>
