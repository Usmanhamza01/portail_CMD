name: Ping Supabase (anti-pause)

# S'exécute automatiquement tous les 3 jours, + possibilité de le lancer à la main
on:
  schedule:
    - cron: '0 8 */3 * *'   # tous les 3 jours à 08h00 UTC (~9h/10h à Dakar selon la saison)
  workflow_dispatch:         # bouton "Run workflow" manuel dans l'onglet Actions

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping du projet Supabase
        run: |
          curl -s -o /dev/null -w "%{http_code}" \
            "${{ secrets.SUPABASE_URL }}/rest/v1/cabinets?select=id&limit=1" \
            -H "apikey: ${{ secrets.SUPABASE_ANON_KEY }}" \
            -H "Authorization: Bearer ${{ secrets.SUPABASE_ANON_KEY }}"
